<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieGo</title>
    <!--Menghubungkan file CSS-->
    <link rel="stylesheet" href="style-moviego.css">
</head>
<body>
    <!--Navbar/Menu navigasi-->
    <nav>
        <!--Logo aplikasi-->
        <div class="logo">
            <img src="moviego3.png">
        </div>

        <!--Menu navigasi-->
        <div class="menu">
            <a href="beranda.html">Beranda</a>
            <a href="film.html">Film</a>
            <a href="jadwal.html">Jadwal</a>
            <a href="pesan.html">Pesan</a>
        </div>
    </nav>

    <!--Halaman pesan tiket-->
    <div class="judul">
        <h1>PESAN TIKET</h1>
    </div>

    <div class="pesan-container">
        <!--Form pemesanan-->
        <div class="form-pesan">
            <form>
                <!--Input nama-->
                <label>Nama Lengkap</label>
                <input type="text" placeholder="Masukkan nama lengkap">
                <!--Pilih film-->
                <label>Pilih Film</label>
                <!--Dropdown pilihan film-->
                <select id="film" onchange="ubahJadwal()">
                    <!--Pilihan awal-->
                    <option value="">Pilih Film</option>
                    <!--Daftar film-->
                    <option value="nawilla">Na Willa</option>
                    <option value="jumbo">Jumbo</option>
                    <option value="pelangi">Pelangi di Mars</option>
                    <option value="zootopia">Zootopia 2</option>
                    <option value="danur">Danur: The Last Chapter</option>
                    <option value="inside">Inside Out 2</option>
                    <option value="elemental">Elemental: Forces of Nature</option>
                    <option value="sampaititik">Sampai Titik Terakhirmu</option>
                    <option value="panggilayah">Panggil Aku Ayah</option>
                </select>

                <!--Pilih jadwal-->
                <label>Pilih Jadwal</label>
                <!--Dropdown jadwal-->
                <select id="jadwal">
                    <!--Tampilan awal-->
                    <option>Pilih Jadwal</option>
                </select>

                <!--Jumlah tiket-->
                <label>Jumlah Tiket</label>
                <!--Dropdown jumlah tiket-->
                <select>
                    <option>Pilih Jumlah</option>
                    <option>1 Tiket</option>
                    <option>2 Tiket</option>
                    <option>3 Tiket</option>
                    <option>4 Tiket</option>
                    <option>5 Tiket</option>
                    <option>6 Tiket</option>
                    <option>7 Tiket</option>
                    <option>8 Tiket</option>
                </select>

                <!--Nomor handphone-->
                <label>No. Handphone</label>
                <input type="text" placeholder="Contoh: 081122334455">

                <button type="submit">
                    PESAN SEKARANG
                </button>
            </form>
        </div>

        <!--Info pemesanan-->
        <div class="info-pesan">
            <h2>&#128712;INFO PEMESANAN</h2>
            <p>Pastikan data yang Anda masukkan sudah benar.</p>
            <p>Tiket yang sudah dipesan tidak dapat dikembalikan.</p>
            <p>Maksimal 8 tiket per transaksi.</p>
            <img src="popcorn4.png">
        </div>
    </div>

    <footer>
        <img src="popcorn_2-removebg-preview.png">
        <p>&copy; 2026 MovieGo. Semua Hak Dilindungi.</p>
    </footer>

    <script>
        <!--Membuat fungsi bernama ubahJadwal-->
        function ubahJadwal() {
            let film= document.getElementById("film").value;
            let jadwal= document.getElementById("jadwal");
            if(film=="nawilla") {
                jadwal.innerHTML = `
                <option>10.00</option>
                <option>13.00</option>
                <option>16.00</option>
                `;
            }
            else if(film=="jumbo") {
                jadwal.innerHTML = `
                <option>11.00</option>
                <option>14.00</option>
                <option>17.00</option>
                `;
            }
            else if(film=="pelangi") {
                jadwal.innerHTML = `
                <option>09.30</option>
                <option>12.30</option>
                <option>15.30</option>
                `;
            }
            else if(film=="zootopia") {
                jadwal.innerHTML = `
                <option>10.30</option>
                <option>13.30</option>
                <option>16.30</option>
                `;
            }
            else if(film=="danur") {
                jadwal.innerHTML = `
                <option>11.30</option>
                <option>14.30</option>
                <option>17.30</option>
                `;
            }
            else if(film=="inside") {
                jadwal.innerHTML = `
                <option>09.00</option>
                <option>12.00</option>
                <option>15.00</option>
                `;
            }
            else if(film=="elemental") {
                jadwal.innerHTML = `
                <option>10.15</option>
                <option>13.15</option>
                <option>16.15</option>
                `;
            }
            else if(film=="sampaititik") {
                jadwal.innerHTML = `
                <option>11.45</option>
                <option>14.45</option>
                <option>17.45</option>
                `;
            }
            else if(film=="panggilayah") {
                jadwal.innerHTML = `
                <option>09.45</option>
                <option>12.45</option>
                <option>15.45</option>
                `;
            }
            else {
                jadwal.innerHTML = `
                <option>Pilih Jadwal</option>
                `;
                
            }
        }
    </script>
</body>
</html>
